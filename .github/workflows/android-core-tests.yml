name: Android Core Tests

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-core-tests.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-core-tests.yml'

jobs:
  android-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Check API 26 Java library compatibility
        working-directory: android
        run: python3 verify_api26_compat.py
      - name: Run control-plane tests and compile Android adapter
        working-directory: android
        run: gradle :core-network:test :core-protocol:test :core-modem:test :core-session:test :platform-android:testDebugUnitTest :app:testDebugUnitTest :platform-android:assembleDebug :platform-android:assembleDebugAndroidTest :app:assembleDebug --stacktrace
