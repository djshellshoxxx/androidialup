plugins {
    // No version: the Android Gradle plugin is already on the build classpath through the
    // root build.gradle (com.android.library 9.4.0, same artifact as the application plugin).
    id 'com.android.application'
}

android {
    namespace 'io.circuitdrift.androidialup.app'
    compileSdk 36

    defaultConfig {
        applicationId 'io.circuitdrift.androidialup'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1-dev'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    // Plain Android framework views only: no AndroidX/Compose UI libraries.
    implementation project(':platform-android')

    // desugar_jdk_libs (Apache-2.0): backports supported newer java.util APIs used by the
    // Android-bound core modules to the app's minSdk 26 runtime.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
