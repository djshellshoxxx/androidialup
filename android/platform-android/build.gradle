plugins {
    id 'com.android.library'
}

android {
    namespace 'io.circuitdrift.androidialup.platform'
    compileSdk 36

    defaultConfig {
        minSdk 26
        // Device-only acceptance tests live in src/androidTest. CI only assembles the test
        // APK (assembleDebugAndroidTest); running it needs a physical device.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    // Exposed as api: the app wires ModemController, RelaySessionMachine and network-policy
    // types through the platform adapters' public signatures.
    api project(':core-network')
    api project(':core-protocol')
    api project(':core-modem')
    api project(':core-session')

    // desugar_jdk_libs (Apache-2.0): needed by the library and its instrumentation APK
    // because Android-bound core dependencies use supported newer java.util APIs.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    testImplementation 'junit:junit:4.13.2'

    // androidx.test runner (Apache-2.0, Google Maven): instrumentation runner only, packaged
    // into the androidTest APK, never into the library or the app.
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'junit:junit:4.13.2'
}
